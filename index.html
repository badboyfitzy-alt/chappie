<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chappie — Universal AI Stream Bot & Creator Suite</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            twitch: {
              purple: '#9146ff',
              hover: '#772ce8',
              dark: '#0e0e10',
              card: '#18181c',
              border: '#26262c',
              accent: '#a970ff'
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #0e0e10; color: #efeff1; font-family: system-ui, -apple-system, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #121215; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #26262c; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9146ff; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-twitch-purple selection:text-white">

  <!-- Header -->
  <header class="bg-twitch-card border-b border-twitch-border sticky top-0 z-50 px-4 lg:px-6 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <button onclick="toggleSidebar()" class="lg:hidden text-zinc-400 hover:text-white text-lg pr-1">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-twitch-purple to-twitch-accent flex items-center justify-center text-white text-lg font-bold shadow-md shadow-purple-900/40">
        🤖
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-extrabold text-lg tracking-tight text-white leading-none">Chappie</h1>
          <span class="text-[10px] uppercase tracking-wider font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full">v3.6 Live</span>
        </div>
        <p class="text-xs text-zinc-400 mt-0.5 hidden sm:block">AI Twitch Bot & Creator Suite</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="bg-zinc-900 border border-twitch-border px-3 py-1.5 rounded-xl flex items-center gap-2">
        <i class="fa-solid fa-coins text-amber-400 text-xs"></i>
        <span class="text-xs font-medium text-zinc-400 hidden sm:inline">Clip Tokens:</span>
        <span id="tokenBalance" class="text-xs font-bold text-amber-400">2,500</span>
      </div>

      <button id="authBtn" onclick="openTwitchAuthPopup()" class="bg-twitch-purple hover:bg-twitch-hover text-white px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-md shadow-purple-900/30">
        <i class="fa-brands fa-twitch text-sm"></i>
        <span id="authBtnText">Connect Twitch Profile</span>
      </button>
    </div>
  </header>

  <!-- Main Body Layout with Sidebar -->
  <div class="flex-1 flex max-w-[1600px] w-full mx-auto">

    <!-- Navigation Sidebar -->
    <aside id="sidebar" class="w-64 bg-twitch-card border-r border-twitch-border p-4 flex flex-col justify-between hidden lg:flex shrink-0">
      <div class="space-y-1">
        <p class="text-[10px] uppercase font-bold text-zinc-500 px-3 mb-2 tracking-wider">Dashboard Navigation</p>
        
        <button onclick="switchTab('overview')" class="tab-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-white bg-twitch-purple/2
